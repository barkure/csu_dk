name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5

      - name: 安装依赖（按锁文件）
        run: uv sync --frozen

      - name: 静态检查
        run: uv run ruff check .

      - name: 测试
        run: uv run pytest -q

      - name: 锁文件与 pyproject 一致
        run: uv lock --check
