<div id="login-panel">
  <form id="login-form" hx-post="/ui/login" hx-target="#login-panel" hx-swap="outerHTML">
    <label>邮箱
      <input name="email" type="email" required placeholder="you@example.com" autocomplete="username" value="{{ email or '' }}">
    </label>
    <label>验证码
      <span class="row">
        <input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="\d{6}" maxlength="6" placeholder="6 位数字" required
               value="{{ code or '' }}" {% if not sent %}disabled{% endif %}>
        <button type="button" class="ghost" id="send-code" data-cooldown="{{ cooldown or 0 }}"
                hx-post="/ui/code" hx-include="closest form"
                hx-target="#login-panel" hx-swap="outerHTML">获取验证码</button>
      </span>
    </label>
    <button type="submit">登录 / 注册</button>
  </form>
  <p class="msg {{ msg_kind }}">{{ msg or '' }}</p>
</div>
